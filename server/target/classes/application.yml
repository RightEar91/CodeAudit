server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: codeaudit

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 60000

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
        one-indexed-parameters: false

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        model: ${OLLAMA_MODEL}
        options:
          temperature: ${OLLAMA_TEMPERATURE}
          top-p: ${OLLAMA_TOP_P}

# AI 模型提供商配置
codeaudit:
  ai:
    provider: ollama  # 可选: ollama / openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o}
      temperature: ${OPENAI_TEMPERATURE:0.1}
      top-p: ${OPENAI_TOP_P:0.9}
    review:
      thinking-enabled: ${CODEAUDIT_REVIEW_THINKING_ENABLED:true}
      parallelism: ${CODEAUDIT_REVIEW_PARALLELISM:2}

logging:
  level:
    com.codeaudit: DEBUG
    org.springframework.ai: DEBUG
